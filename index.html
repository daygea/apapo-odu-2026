<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apapo Odu Ifa Initiates</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style>
  /* ---------- shell / background ---------- */
  html, body { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 12px;
    min-height: 100vh;
    min-height: 100dvh;
    color: #fff;
    background-image: url('img/620088.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: scroll;
  }
  @media (min-width: 768px) {
    body { padding: 20px; }
  }

  .hidden { display: none; }
  .up      { text-transform: uppercase; }

  /* ---------- hero heading ---------- */
  @media (max-width: 575px) {
    h1 { font-size: 22px; margin: 8px 0 4px; }
    h3 { font-size: 18px; }
    #userSection p { font-size: 14px; word-break: break-word; }
    .btn { padding: 10px 16px; font-size: 15px; }
  }

  /* ---------- year selector ---------- */
  #yearBar {
    display: flex; justify-content: center; align-items: center;
    gap: 8px; flex-wrap: wrap; margin: 8px 0 18px;
  }
  #yearBar label { margin: 0; }
  .year-select   { max-width: 120px; min-height: 40px; }

  /* ---------- initiate card ---------- */
  #userSection {
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; min-height: 50vh; text-align: center;
    padding: 0 4px;
  }

  /* ---------- pagination touch targets ---------- */
  #paginationControls button {
    min-width: 40px; min-height: 40px; margin: 2px;
    font-size: 14px;
  }

  /* ---------- admin logout on mobile ---------- */
  .logout-btn { float: right; margin-bottom: 10px; }
  @media (max-width: 575px) {
    .logout-btn { float: none; display: block; width: 100%; margin: 8px 0; }
  }

  /* =========================================================
     ADMIN TABLE -> CARDS ON PHONES
     ========================================================= */
  @media (max-width: 767px) {
    .admin-table thead { display: none; }
    .admin-table,
    .admin-table tbody,
    .admin-table tr,
    .admin-table td { display: block; width: 100%; }

    .admin-table tr {
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .admin-table td {
      border: 0 !important;
      padding: 4px 0;
      display: flex;
      gap: 8px;
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
    }

    .admin-table td::before {
      content: attr(data-label);
      flex: 0 0 88px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      opacity: .7;
      padding-top: 2px;
    }
  }
</style>
</head>
<body>
<div class="container">

  <h1 class="text-center" id="pageTitle">Apapo Odu Ifa Initiates</h1>

  <div id="yearBar">
    <label for="yearSelect">Year:</label>
    <select id="yearSelect" class="form-control year-select" onchange="onYearChange(this.value)"></select>
  </div>

  <!-- Login -->
  <div id="loginSection">
    <h3 class="text-center">Login to view your Odu Ifa</h3>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="Enter Username" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <div style="color:white" id="loginMessage" class="mt-2"></div>
  </div>

  <div id="profileSelection" class="mt-3 text-center"></div>

  <!-- Initiate details -->
  <div id="userSection" class="hidden">
    <h3>INITIATE DETAILS</h3>
    <p><b>NAME: <span class="up" id="userUsername"></span> OMO <span class="up" id="userPassword"></span></b></p>
    <p><b>ODU IFA: <span class="up" id="userStatus"></span></b></p>
    <p><b>IKITA IFA: <span class="up" id="userIkita"></span></b></p>
    <p><b>ORUKO & ORISHA: <span class="up" id="userOrukoOrisha"></span></b></p>
    <a class="btn btn-default" target="_blank" href="https://orirun.com">Click to view the full message here</a><br><br>
    <button onclick="logout()" class="btn btn-warning">Logout</button>
  </div>

  <!-- Admin -->
  <div id="adminSection" class="hidden">
    <h3>Administrator Dashboard — <span id="adminYear"></span></h3>
    <a class="btn btn-default" target="_blank" href="https://orirun.com">View the full messages here</a>
    <button onclick="logout()" class="btn btn-warning logout-btn">Logout</button>
    <div class="form-group">
      <input type="text" id="searchInput" class="form-control"
             placeholder="Search by name, mother's name, Odu Ifa…" oninput="handleSearch()">
    </div>
    <table class="table admin-table">
      <thead>
        <tr><th>S/N</th><th>Name</th><th>Mother</th><th>Odu Ifa</th><th>Ikita Ifa</th><th>Oruko & Orisha</th></tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
    <div id="paginationControls" class="text-center mt-3"></div>
  </div>

</div>

<script>
/* ------------------------------------------------------------------ */
/*  State                                                              */
/* ------------------------------------------------------------------ */
const DATA_DIR = "data";
const USERS_PER_PAGE = 20;

let CONFIG = { years: [], siteTitle: "Apapo Odu Ifa Initiates" };
let year = null;
let users = [];

let currentUser = null;
let currentPage = 1;
let isSearching = false;
let filteredUsers = [];

/* ------------------------------------------------------------------ */
/*  Boot                                                               */
/* ------------------------------------------------------------------ */
document.addEventListener("DOMContentLoaded", init);

async function init() {
  try {
    CONFIG = await getJSON(`${DATA_DIR}/config.json`);
  } catch (e) {
    return fatal("Could not load data/config.json", e);
  }

  const years = (CONFIG.years || []).map(String);
  if (!years.length) return fatal("No years listed in data/config.json");

  const fromUrl = new URLSearchParams(location.search).get("year");
  const startYear = years.includes(fromUrl)
    ? fromUrl
    : (years.includes(String(CONFIG.defaultYear)) ? String(CONFIG.defaultYear) : years[years.length - 1]);

  populateYearSelect(years, startYear);
  await loadYear(startYear);
}

function populateYearSelect(years, selected) {
  document.getElementById("yearSelect").innerHTML = years
    .map(y => `<option value="${esc(y)}"${y === selected ? " selected" : ""}>${esc(y)}</option>`)
    .join("");
}

async function loadYear(y) {
  const wasAdmin = currentUser && currentUser.isAdmin;
  year = y;
  try {
    users = await getJSON(`${DATA_DIR}/initiates-${y}.json`);
  } catch (e) {
    return fatal(`Could not load initiates for ${y}`, e);
  }

  document.title = `${CONFIG.siteTitle} ${y}`;
  document.getElementById("pageTitle").textContent = `${CONFIG.siteTitle} ${y}`;

  const url = new URL(location);
  url.searchParams.set("year", y);
  history.replaceState(null, "", url);

  resetUI();
  if (wasAdmin) {
    currentUser = { username: CONFIG.admin.username, isAdmin: true };
    showAdminDashboard();
  }
}

function onYearChange(y) {
  if (y !== year) loadYear(y);
}

/* ------------------------------------------------------------------ */
/*  Login                                                              */
/* ------------------------------------------------------------------ */
function handleLogin(event) {
  event.preventDefault();
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value.trim();
  const msg = document.getElementById("loginMessage");

  // 1. Admin (independent of year)
  const a = CONFIG.admin;
  if (a && username.toLowerCase() === String(a.username).toLowerCase() && password === a.password) {
    currentUser = { username: a.username, isAdmin: true };
    clearLoginForm();
    return showAdminDashboard();
  }

  // 2. Initiate — case-insensitive on both fields
  const needleUser = username.toLowerCase();
  const needlePass = password.toLowerCase();
  const matches = users.filter(u =>
    String(u.username).toLowerCase() === needleUser &&
    String(u.password).toLowerCase() === needlePass
  );

  if (matches.length === 1) {
    currentUser = matches[0];
    showUserDetails();
  } else if (matches.length > 1) {
    msg.textContent = "Multiple accounts found. Please select your profile.";
    msg.className = "text-warning";
    renderProfileChoices(matches);
  } else {
    msg.textContent = "Invalid username or password.";
    msg.className = "text-danger";
  }
  clearLoginForm();
}

function renderProfileChoices(matches) {
  const box = document.getElementById("profileSelection");
  box.innerHTML = "";
  matches.forEach(u => {
    const btn = document.createElement("button");
    btn.className = "btn btn-warning btn-lg my-1 btn-block";
    btn.textContent = `${u.orukoOrisha} — ${u.status}`;
    btn.onclick = () => {
      currentUser = u;
      box.innerHTML = "";
      document.getElementById("loginMessage").textContent = "";
      showUserDetails();
    };
    box.appendChild(btn);
  });
}

/* ------------------------------------------------------------------ */
/*  Views                                                              */
/* ------------------------------------------------------------------ */
function showUserDetails() {
  hide("loginSection"); show("userSection");
  document.getElementById("userUsername").textContent    = currentUser.username;
  document.getElementById("userPassword").textContent    = currentUser.password;
  document.getElementById("userStatus").textContent      = currentUser.status;
  document.getElementById("userIkita").textContent       = currentUser.ikita;
  document.getElementById("userOrukoOrisha").textContent = currentUser.orukoOrisha;
}

function showAdminDashboard() {
  hide("loginSection"); hide("userSection"); show("adminSection");
  document.getElementById("adminYear").textContent = year;
  currentPage = 1; isSearching = false; filteredUsers = [];
  document.getElementById("searchInput").value = "";
  updateUserTable();
}

function logout() { resetUI(); }

function resetUI() {
  currentUser = null;
  currentPage = 1;
  isSearching = false;
  filteredUsers = [];
  hide("userSection"); hide("adminSection"); show("loginSection");
  document.getElementById("profileSelection").innerHTML = "";
  document.getElementById("loginMessage").textContent = "";
}

/* ------------------------------------------------------------------ */
/*  Admin table                                                        */
/* ------------------------------------------------------------------ */
function updateUserTable() {
  const tbody = document.getElementById("userTableBody");
  const pag   = document.getElementById("paginationControls");
  tbody.innerHTML = ""; pag.innerHTML = "";

  const entries = isSearching ? filteredUsers : users;
  const total = entries.length;
  const totalPages = Math.max(1, Math.ceil(total / USERS_PER_PAGE));

  currentPage = Math.min(Math.max(currentPage, 1), totalPages);

  const start = (currentPage - 1) * USERS_PER_PAGE;
  const end   = Math.min(start + USERS_PER_PAGE, total);

  if (!total) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center">No matching records.</td></tr>`;
  }

  for (let i = start; i < end; i++) {
    const u = entries[i];
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td data-label="S/N">${i + 1}</td>
      <td data-label="Name">${esc(u.username)}</td>
      <td data-label="Mother">${esc(u.password)}</td>
      <td data-label="Odu Ifa"  class="up">${esc(u.status)}</td>
      <td data-label="Ikita Ifa" class="up">${esc(u.ikita)}</td>
      <td data-label="Oruko & Orisha"    class="up">${esc(u.orukoOrisha)}</td>`;
    tbody.appendChild(tr);
  }

  // Prev / page numbers / Next
  const addBtn = (label, page, disabled, active) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = `btn btn-sm ${active ? "btn-primary" : "btn-default"}`;
    b.style.margin = "0 3px";
    b.disabled = disabled;
    b.onclick = () => { currentPage = page; updateUserTable(); };
    pag.appendChild(b);
  };

  addBtn("« Prev", currentPage - 1, currentPage === 1, false);
  for (let p = 1; p <= totalPages; p++) addBtn(p, p, false, p === currentPage);
  addBtn("Next »", currentPage + 1, currentPage === totalPages, false);
}

function handleSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) {
    isSearching = false;
    filteredUsers = [];
  } else {
    isSearching = true;
    const fields = ["username", "password", "status", "ikita", "orukoOrisha"];
    filteredUsers = users.filter(u =>
      fields.some(k => String(u[k] || "").toLowerCase().includes(q))
    );
  }
  currentPage = 1;
  updateUserTable();
}

/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */
async function getJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
  return res.json();
}

function clearLoginForm() {
  document.getElementById("loginUsername").value = "";
  document.getElementById("loginPassword").value = "";
}
function show(id) { document.getElementById(id).classList.remove("hidden"); }
function hide(id) { document.getElementById(id).classList.add("hidden"); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function fatal(msg, err) {
  if (err) console.error(err);
  document.getElementById("loginMessage").textContent = msg;
  document.getElementById("loginMessage").className = "text-danger";
}
</script>
</body>
</html>
